      <style>
        .md-preloader-bg {
          position: fixed;
          top: 0; left: 0; right: 0; bottom: 0;
          background-color: #0a0a0a;
          display: flex;
          align-items: center;
          justify-content: center;
          flex-direction: column;
          z-index: 99999;
        }
        .md-spinner {
          width: 48px;
          height: 48px;

          border-radius: 50%;
          animation: md-spin 1s linear infinite;
          margin-bottom: 24px;
        }
        .md-loading-text {
          color: #ffffff;
          font-family: 'Inter', sans-serif;
          font-size: 13px;
          letter-spacing: 4px;
          text-transform: uppercase;
          animation: md-pulse 1.5s ease-in-out infinite;
        }
        @keyframes md-spin { 
          to { transform: rotate(360deg); } 
        }
        @keyframes md-pulse {
          0%, 100% { opacity: 0.5; }
          50% { opacity: 1; }
        }
      </style>
